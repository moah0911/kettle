name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/kettle/models.py src/kettle/coordinator.py src/kettle/scorers.py
      - run: uv run pytest --cov=kettle --cov-fail-under=60 tests/ -q
      - run: uv run python -m kettle.factory_check --factory ./factory
