services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kettle
      POSTGRES_PASSWORD: kettle
      POSTGRES_DB: kettle
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  temporal:
    image: temporalio/auto-setup:1.25
    ports: ["7233:7233", "8233:8233"]
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: kettle
      POSTGRES_PWD: kettle
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]

  api:
    build: .
    command: uvicorn kettle.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://kettle:kettle@postgres/kettle
      TEMPORAL_HOST: temporal:7233
    depends_on: [postgres, temporal]

  worker:
    build: .
    command: python -m kettle.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://kettle:kettle@postgres/kettle
      TEMPORAL_HOST: temporal:7233
      RUNNER_BACKEND: docker
    depends_on: [postgres, temporal]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]

volumes:
  postgres-data:
